name: Microsoft Store

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, e.g. v0.5.0'
        type: string
        required: true

jobs:
  store:
    name: Draft Microsoft Store submission
    runs-on: windows-latest
    environment: store
    # Caller jobs using reusable workflows cannot set continue-on-error.
    # Keep it on this inner job so Store outages do not block package managers.
    # A Store failure (an expired client secret, a Partner Center outage) must
    # not fail the run: package-managers.yml publishes only from a successful
    # run, so v0.5.0's Store failure also held back WinGet, Chocolatey and
    # Homebrew. The job still shows as failed.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      STORE_APP_ID: 9PFC0XC16C1G
    steps:
      - name: Guard manual redelivery and stable tags
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/test ]; then
            echo "::error::Manual redelivery runs from test."
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "::error::Prereleases never go to the Microsoft Store."
            exit 1
          fi
      # The CLI reads package.json to recognise an Electron project; it does
      # not build anything when given a directory of packages.
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Download the Store package
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v7
        with:
          name: neuron-store-appx
          path: store-package
      - name: Find the release run for manual redelivery
        if: github.event_name == 'workflow_dispatch'
        id: release-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          run_id=$(gh run list --workflow release.yml --branch "$TAG" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No completed release.yml run found for tag $TAG."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the retained Store package
        if: github.event_name == 'workflow_dispatch'
        id: retained-package
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: neuron-store-appx
          path: store-package
          run-id: ${{ steps.release-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Explain unavailable Store artifact
        if: steps.retained-package.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The neuron-store-appx artifact is unavailable or expired; Store packages are retained for 90 days."
          exit 1
      - name: Set up the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Configure the Microsoft Store Developer CLI
        shell: bash
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        # reconfigure first: every other command, settings included, exits with
        # "SellerId is not set" until the CLI has a configuration. v0.5.0's
        # Store job failed on exactly that.
        run: |
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
          msstore settings --enableTelemetry false
      # --inputDirectory, not the --inputFile the published docs still name:
      # the CLI publishes every .appx at the top of that directory, which is
      # why the artifact gets a directory of its own.
      - name: Upload the package as a draft submission
        shell: bash
        run: msstore publish . --inputDirectory store-package --appId "$STORE_APP_ID" --noCommit
