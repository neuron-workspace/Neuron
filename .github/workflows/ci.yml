name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # One platform is not cross-platform testing. Neuron leans on node-pty, a
    # filesystem watcher, spawned processes, keyboard chords, path handling and
    # Electron window behaviour -- every one of which diverges between Windows,
    # macOS and Linux. Running only on Windows proved the code compiled, not
    # that it worked anywhere else.
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMP: macOS-only while diagnosing. Restore the full matrix.
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check main and renderer
        run: npm run typecheck
      - name: Run test suites
        run: npm test
      - name: Build application
        run: npm run build

      # Electron needs a display server. The GitHub Windows and macOS runners
      # have one; the Linux runner does not, so the suite is wrapped in a
      # virtual framebuffer rather than left to fail as "Electron crashed".
      - name: Probe the node-pty shell helper
        if: runner.os == 'macOS'
        run: |
          echo "SHELL=$SHELL"
          ls -l /bin/bash || true
          find node_modules/node-pty -name 'spawn-helper' -exec ls -l {} \; || true
          node -e "const p=require('node-pty'); const t=p.spawn(process.env.SHELL||'/bin/bash',[],{});
                   t.onData(d=>{console.log('PTY-DATA', JSON.stringify(d.slice(0,40))); process.exit(0);});
                   setTimeout(()=>{console.log('PTY-SILENT'); process.exit(0);}, 4000);" || echo "PTY-THREW"

      - name: Run Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test e2e/run-button.spec.ts e2e/version-history.spec.ts
      - name: Run Electron end-to-end tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:e2e

      # Launch what a user would actually download.
      #
      # 0.4.3 shipped an application that could not start while every test was
      # green: they all run against dist/main/main.js with the full
      # node_modules tree present, and the packaged app loads from app.asar,
      # which holds only what electron-builder can reach from `dependencies`.
      # Building successfully says nothing about starting.
      - name: Smoke-test the packaged application
        if: false
        run: npm run smoke
      - name: Smoke-test the packaged application (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run smoke

      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
