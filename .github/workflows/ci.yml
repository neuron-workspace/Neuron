name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request that only touches documentation cannot break the app, so it
  # need not wait on three platforms of install, build and Electron tests.
  #
  # This is not `paths-ignore`: Windows, macOS and Linux are required checks,
  # and a workflow that never starts never reports them, so a docs-only pull
  # request would sit blocked forever. The platform jobs below always run and
  # report; they just skip their steps when this job says nothing needs testing.
  # Pushes to main and dev always run everything.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          # Nothing under docs/, no top-level Markdown file and none of the
          # GitHub community files is read by the build or by any test. Markdown
          # anywhere else (examples/, src/) is fixture or app content and counts.
          docs='^(docs/|[^/]+\.md$|LICENSE$|NOTICE$|\.github/(ISSUE_TEMPLATE/|[^/]+\.md$))'
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE "$docs"; then
            echo "Documentation only; the platform jobs will skip their steps."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: changes
    env:
      RUN: ${{ needs.changes.outputs.code }}
    # One platform is not cross-platform testing. Neuron leans on node-pty, a
    # filesystem watcher, spawned processes, keyboard chords, path handling and
    # Electron window behaviour -- every one of which diverges between Windows,
    # macOS and Linux. Running only on Windows proved the code compiled, not
    # that it worked anywhere else.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            wrap: ''
          - name: macOS
            os: macos-latest
            wrap: ''
          # Electron needs a display server and the Linux runner has none, so
          # everything that opens a window runs under a virtual framebuffer.
          # Without it the failure reads as "Electron crashed" rather than as a
          # missing display.
          - name: Linux
            os: ubuntu-latest
            wrap: 'xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24"'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip for a documentation-only change
        if: env.RUN != 'true'
        run: echo "Only documentation changed, so there is nothing to build or test."
      - name: Check out repository
        if: env.RUN == 'true'
        uses: actions/checkout@v5
      - name: Set up Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v5
        with:
          # Matches release.yml. Testing on 20 while shipping from 22 means the
          # runtime that builds what users install is the one nothing runs the
          # test suite against.
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: env.RUN == 'true'
        run: npm ci
      - name: Type-check main and renderer
        if: env.RUN == 'true'
        run: npm run typecheck
      - name: Run test suites
        if: env.RUN == 'true'
        run: npm test
      - name: Build application
        if: env.RUN == 'true'
        run: npm run build

      - name: Run Electron end-to-end tests
        if: env.RUN == 'true'
        run: ${{ matrix.wrap }} npm run test:e2e

      # Launch what a user would actually download.
      #
      # 0.4.3 shipped an application that could not start while every test was
      # green: they all run against dist/main/main.js with the full
      # node_modules tree present, and the packaged app loads from app.asar,
      # which holds only what electron-builder can reach from `dependencies`.
      # Building successfully says nothing about starting.
      - name: Smoke-test the packaged application
        if: env.RUN == 'true'
        run: ${{ matrix.wrap }} npm run smoke

      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
