name: Release desktop builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Build provenance is signed with a short-lived OIDC identity; the workflow
  # cannot mint one without id-token, and cannot store the result without
  # attestations. Neither grants access to anything else.
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # nsis + portable here; the Store package is built by its own step
            # below so an appx failure cannot cost you the installers.
            args: --win nsis portable --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          # Two architectures, not one universal binary. Calling it universal
          # described a target electron-builder was never asked to build.
          - name: macOS x64 + arm64
            os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Windows code signing is opt-in: with no certificate secret configured
      # the build runs exactly as before and produces unsigned installers,
      # rather than failing. Do not point this at a bought certificate without
      # reading docs/distribution.md first -- the same wiring works, but the
      # trust story is completely different.
      - name: Stage the Windows signing certificate
        id: cert
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Decided in the script, not in an `if:` expression. Whether a
          # step's own env is in scope for its own condition is exactly the
          # kind of thing that quietly evaluates false and ships unsigned.
          if [ -z "$WINDOWS_CERT_BASE64" ]; then
            echo "No WINDOWS_CERT_BASE64 secret set; installers will be unsigned."
            exit 0
          fi
          printf '%s' "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/signing.pfx"
          # Exported here rather than set on the build step, so the variables
          # simply do not exist on macOS and Linux. Setting them there to an
          # empty string is not the same as leaving them unset: electron-builder
          # read the empty CSC_LINK as a certificate path, resolved it to the
          # working directory, and failed the macOS build with
          # "/Users/runner/work/Neuron/Neuron not a file".
          echo "CSC_LINK=$RUNNER_TEMP/signing.pfx" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CERT_PASSWORD" >> "$GITHUB_ENV"
          echo "path=$RUNNER_TEMP/signing.pfx" >> "$GITHUB_OUTPUT"
          echo "Certificate staged; electron-builder will sign."

      - name: Build installers (no publish)
        run: |
          npm run build
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Launch what was just packaged, before anything is published.
      #
      # 0.4.3 shipped an application that could not start: `zod` is a peer
      # dependency of the AI SDK, npm hoists peers to the root so development
      # and every end-to-end test worked, and electron-builder does not follow
      # peers -- so it was absent from app.asar. Nothing in the suite had ever
      # launched the artifact users download.
      # Every platform, not just Windows. The dependency that broke 0.4.3 was
      # missing from all three packages; Windows is simply where it was
      # reported first.
      #
      # Both macOS bundles, because only one of them used to be checked and it
      # was the wrong one. The old note here claimed the runner could not
      # execute the arm64 build -- backwards: macos-latest IS Apple Silicon, so
      # arm64 is the native build and the most downloaded one, while
      # `release/mac` is the x64 build it runs under Rosetta.
      - name: Smoke-test the packaged application
        if: runner.os == 'Windows'
        run: npm run smoke -- release/win-unpacked
      - name: Smoke-test the packaged application (arm64)
        if: runner.os == 'macOS'
        run: npm run smoke -- release/mac-arm64
      - name: Smoke-test the packaged application (x64)
        if: runner.os == 'macOS'
        run: npm run smoke -- release/mac
      - name: Smoke-test the packaged application
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run smoke -- release/linux-unpacked

      # Built separately, and after the installers, for two reasons: a failure
      # here must not lose the .exe artifacts, and the Store package is not a
      # download -- electron-builder deliberately leaves it unsigned because
      # Partner Center signs it on submission. It goes to a different place
      # than the release, so it gets its own artifact.
      - name: Build the Microsoft Store package
        if: runner.os == 'Windows'
        run: npx electron-builder --win appx --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload the Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: neuron-store-appx
          retention-days: 14
          if-no-files-found: error
          path: release/*.appx

      - name: Remove the certificate from the runner
        if: always() && steps.cert.outputs.path != ''
        shell: bash
        run: rm -f "${{ steps.cert.outputs.path }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: neuron-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      # What actually lets someone prove a download is the build CI produced.
      #
      # A self-signed Authenticode certificate cannot do this: it has no trust
      # anchor, so anyone who tampers with an installer can re-sign it with
      # their own certificate carrying the same subject and Windows shows the
      # two identically. These two artifacts can't be forged that way --
      # provenance is signed by GitHub's OIDC identity and names the exact
      # workflow, commit and runner that produced each file.
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sha256sum {} + | sed 's|\./[^/]*/||' | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Neuron ${{ github.ref_name }}
          generate_release_notes: true
          # Any tag carrying a prerelease segment (v0.4.2-beta.1) publishes as a
          # prerelease, so it is not offered as the latest download and
          # electron-updater does not push it to stable users.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          # Explicit extensions rather than artifacts/**/* so the Store package
          # stays out. It is unsigned by design and only Partner Center can do
          # anything with it; on a download page it is a support ticket.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
            SHA256SUMS.txt

      # Policy: keep only the newest patch per major.minor. After publishing
      # vX.Y.Z, delete any released vX.Y.<lower> (release + its tag). Strictly
      # scoped — never touches a different major.minor or the current tag.
      - name: Prune superseded patch releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          ver="${tag#v}"
          minor="${ver%.*}"
          this_patch="${ver##*.}"
          case "$this_patch" in ''|*[!0-9]*) echo "Non-numeric patch in $tag; skipping prune."; exit 0 ;; esac
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r t; do
            v="${t#v}"
            [ "${v%.*}" = "$minor" ] || continue
            p="${v##*.}"
            case "$p" in ''|*[!0-9]*) continue ;; esac
            if [ "$t" != "$tag" ] && [ "$p" -lt "$this_patch" ]; then
              echo "Pruning $t — superseded by $tag"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
