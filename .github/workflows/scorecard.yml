name: OpenSSF Scorecard

# Supply-chain checks (pinned actions, token permissions, branch protection,
# signed releases...) from OpenSSF Scorecard. Results go to code scanning and
# are published to the public Scorecard API, which is what the badge reads.
#
# Publishing has rules this file must keep: no top-level env or defaults, no
# containers or services, ubuntu-latest, and only the actions used below.
# Actions are pinned to full commit SHAs; the comment names the release.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday 05:41 UTC.
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
