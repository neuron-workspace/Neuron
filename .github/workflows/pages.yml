name: Deploy redirects

# The website moved to neuron-workspace/neuron-workspace.github.io and serves
# from the organisation root. This deploys five redirect stubs in its place.
#
# They exist because the Settings page of every already-installed build links to
# https://neuron-workspace.github.io/Neuron/privacy.html and .../license.html.
# Those binaries cannot be changed, so the path has to keep resolving.
#
# It uploads redirects/ rather than docs/ on purpose. The old workflow uploaded
# the whole of docs/, which is why plans/, roadmap/ and design/ were being served
# publicly as raw Markdown; pointing Pages at a directory that holds nothing but
# stubs means a file cannot be published here by being dropped in the wrong
# folder.
on:
  push:
    branches: [main]
    paths:
      - "redirects/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload redirects
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirects
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
