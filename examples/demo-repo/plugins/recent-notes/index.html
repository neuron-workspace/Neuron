<header>
  <h1>Recent notes</h1>
  <p>A small reading list supplied by a sandboxed workspace plugin. It can read
  note metadata, but it cannot modify files, start a terminal, call AI, or use
  the network.</p>
</header>

<section>
  <div class="neuron-metric-label">Recently edited</div>
  <div
    hx-get="/api/v1/notes?limit=12"
    hx-trigger="load"
    hx-swap="innerHTML"
    aria-live="polite"
  >Loading notes…</div>
</section>
